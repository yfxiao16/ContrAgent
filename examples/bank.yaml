# The library from the README, plus a count bound, an obligation, and one
# assume-guarantee contract.
#
# Formulas are ALTLf over the interaction predicates (docs/predicates.md);
# docs/authoring.md explains how to write them.
version: "1"
agents:
  "*":
    contracts:
      - desc: "identity must be verified before funds move"
        G: {ltl: "(!(called('transfer_funds')) U called('verify_identity')) | G(!(called('transfer_funds')))"}
      - desc: "no email after a file read"
        G: {ltl: "G((called('read_file') -> G(!(called('send_email')))))"}
      - desc: "at most three transfers per session"
        G: {ltl: "G((Var('count', 'transfer_funds') <= 3))"}
      - desc: "every transfer is eventually receipted"
        G: {ltl: "G((called('transfer_funds') -> F(called('send_receipt'))))"}
      - desc: "no private key reaches the model or leaves in an email"
        A: {ltl: "G(!(output_has('read_file', 'BEGIN PRIVATE KEY')))"}
        G: {ltl: "G(!(arg_field_has('send_email', 'body', 'BEGIN PRIVATE KEY')))"}
