# =============================================================================
# ContrAgent SOP contracts -- online_market domain.
#
# PER-TASK GATE SCOPING (false-positive fix): SOPBench gates are per-task
# customizable -- a gate is part of the SOP for some tasks and disabled for
# others. convert.py reads each task's own ``constraints`` tree (the policy
# spec, NOT the satisfaction verdict -- SOPBench's evaluator/State_Tracker is
# never run) and grounds a per-task boolean ``gate_<G>_active`` for every gate
# the tree UNCONDITIONALLY requires (and/chain-required; OR branches and guarded
# ``gate`` nodes are conservatively inactive). It is injected onto the goal
# tool-call, and each contract is guarded with
#     & arg_value(<goal>, gate_<G>_active) >= 1
# so a gate only fires on tasks whose SOP actually includes it (the added
# assumption is exactly "& gate_<G>_active"; the gate check is unchanged).
#
# The user-existence precondition is discharged by an explicit existence check
# OR a successful login (login_user verifies the username internally).
#
# Out of scope (honest): DB-state gates (eligibility / balances / dates /
# capacities) are not observable in tool args; non-user existence checks are
# enforced inside the goal tool in SOPBench "program" mode (a separate check
# call is rarely made even on legitimate completions, so a precedence rule there
# only over-blocks) and are dropped rather than kept as noise.
#
#
# HONESTY PRINCIPLE: every rule is a human-readable LTL contract authored from
# the online_market SOP in env/domains/online_market/online_market.py (State_Tracker conditions
# and each goal's dependency tree in data/online_market_tasks.json). No rule reads a
# precomputed SOP verdict. Each gate is required by the SOP for that goal in
# >=90% of the benchmark's tasks (gates that are per-task customizable below
# that bar are omitted to avoid systematically overblocking legitimately
# disabled cases). All atoms are OBSERVABLE in the trajectory:
#
#   * called(<tool>)                       -- the tool was actually called
#   * arg_value(<tool>, succeeded)         -- this call returned success
#                                             (syntactic read of the result)
#   * arg_value(<tool>, prior_logged_in)   -- login_user succeeded earlier
#                                             (observable auth fact, not a verdict)
#   * arg_value(<tool>, <amount>)          -- the real monetary argument
#
# Ordering rules are success-scoped: they fire only when the goal actually
# COMPLETED without its required check -- a refused/failed attempt took no
# effect and is not an SOP violation.
#
#   "check C must precede a completed goal G":
#     (!(called(G) & G.succeeded) U called(C)) | G(!(called(G) & G.succeeded))
#
# CONTENT-ATOM GATE (now groundable -- value is in the tool-call args):
#   within_review_limits(rating): the `rating` argument of a completed add_review
#   must satisfy rating_lower_bound <= rating <= rating_upper_bound. These bounds
#   are SOP DOMAIN CONSTANTS (online_market.py: rating_lower_bound=1,
#   rating_upper_bound=5), not DB state -- and the rating itself is passed in the
#   tool call -- so this gate is faithfully expressible as raw LTL over the
#   observable `rating` arg. (A small handful of task configs override the bounds
#   to [7,10]; we encode the SOP default [1,5], which is the published policy, not
#   a per-task / label-derived value.)
#
# NOT COVERED (ungroundable -- DB-state or per-task-param gates with no
# observable constant arg):
#   credit_status_excellent / not_restricted_or_suspended, order_delivered/processing, within_exchange_period, less_than_max_exchanges, unique_review, product_bought_by_user, coupon_valid/_not_expired/_not_already_used, enough_stock (quantity <= product.stock: arg present but threshold is DB stock), within_return_period, has_shipping_address, has_items_in_cart -- read order status, credit rating, stock, review/coupon history from the DB.
# =============================================================================

version: "1"

agents:
  "*":
    contracts:

      # --- Auth: logged_in_user (login before completing the action).

      # --- Existence-check ordering required by the SOP before each goal.
      - desc: "internal_check_username_exist must precede a completed add_shipping_address (SOP existence check)"
        G: {ltl: "(!(called(add_shipping_address) & arg_value(add_shipping_address, succeeded) >= 1 & arg_value(add_shipping_address, gate_internal_check_username_exist_active) >= 1) U (called(internal_check_username_exist) | called(login_user))) | G(!(called(add_shipping_address) & arg_value(add_shipping_address, succeeded) >= 1 & arg_value(add_shipping_address, gate_internal_check_username_exist_active) >= 1))"}
      - desc: "internal_check_username_exist must precede a completed place_order (SOP existence check)"
        G: {ltl: "(!(called(place_order) & arg_value(place_order, succeeded) >= 1 & arg_value(place_order, gate_internal_check_username_exist_active) >= 1) U (called(internal_check_username_exist) | called(login_user))) | G(!(called(place_order) & arg_value(place_order, succeeded) >= 1 & arg_value(place_order, gate_internal_check_username_exist_active) >= 1))"}

      # --- Content-atom numeric guard: within_review_limits (rating in [1,5]).
      # The `rating` value is in the add_review tool call; bounds are SOP
      # domain constants (rating_lower_bound=1, rating_upper_bound=5).

      # =====================================================================
      # STATE / ELIGIBILITY GATES -- value-vs-threshold.
      # convert.py grounds SOP thresholds (constraint_parameters) as param_<name>
      # and goal args as themselves. Rules are the literal predicates from
      # OnlineMarket_State_Tracker in env/domains/online_market/online_market.py.
      # Fires only when the goal COMPLETED and the gate is in THIS task's SOP.
      # =====================================================================

      # within_review_limits: rating_lower_bound <= rating <= rating_upper_bound
      #   (rating is a goal arg; both bounds are grounded params).
      - desc: "add_review requires the rating to be at or above the lower bound"
        G: {ltl: "G((called(add_review) & arg_value(add_review, succeeded) >= 1 & arg_value(add_review, gate_within_review_limits_active) >= 1) -> arg_value(add_review, rating) >= arg_value(add_review, param_rating_lower_bound))"}
      - desc: "add_review requires the rating to be at or below the upper bound"
        G: {ltl: "G((called(add_review) & arg_value(add_review, succeeded) >= 1 & arg_value(add_review, gate_within_review_limits_active) >= 1) -> arg_value(add_review, rating) <= arg_value(add_review, param_rating_upper_bound))"}

      # =====================================================================
      # DATE-WINDOW + COUNT gates as a DISJUNCTION (the SOP's actual OR).
      # SOPBench allows an exchange/return when EITHER the time/count windows
      # hold OR the user has excellent credit:
      #     exchange:  (within_exchange_period AND less_than_max_exchanges)
      #                OR credit_status_excellent
      #     return:     within_return_period OR credit_status_excellent
      # convert.py grounds these observable facts off the GIVEN world state:
      #   now_epoch                  -- ordinal of interaction_time
      #   exchange_window_end_epoch  -- order_placed_date + exchange_period
      #   return_window_end_epoch    -- order_placed_date + return_period
      #   order_exchange_count       -- the named order's number_of_exchanges
      #   credit_excellent           -- 1 iff credit_rating == "excellent"
      # The per-order values are selected by the order_id the goal CALL names.
      # The contract spells out the FULL disjunction, so it is sound even though
      # the gate sits in an OR (scoped by ``_present``: gates appearing anywhere
      # in the task's SOP tree). No verdict is grounded -- the OR comparison is
      # authored, in the open, in LTL.
      # =====================================================================
      - desc: "a completed exchange must be within the exchange window and count OR by an excellent-credit user"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_within_exchange_period_present) >= 1) -> (arg_value(exchange_product, credit_excellent) >= 1 | (arg_value(exchange_product, now_epoch) <= arg_value(exchange_product, exchange_window_end_epoch) & arg_value(exchange_product, order_exchange_count) < arg_value(exchange_product, param_max_exchange_times))))"}
      - desc: "a completed return must be within the return window OR by an excellent-credit user"
        G: {ltl: "G((called(return_order) & arg_value(return_order, succeeded) >= 1 & arg_value(return_order, gate_within_return_period_present) >= 1) -> (arg_value(return_order, credit_excellent) >= 1 | arg_value(return_order, now_epoch) <= arg_value(return_order, return_window_end_epoch)))"}

      # =====================================================================
      # CROSS-ENTITY world-state gate -- enough_stock.
      # convert.py reads the PRODUCTS collection in initial_database, locates the
      # row by the product_id the goal CALL names (add_to_cart: product_id;
      # exchange_product: new_product_id), and grounds the stored ``stock`` as the
      # fact ``product_stock``. This is the same honest move as grounding the
      # user's own credit_score -- a stored value, not a verdict. The SOP
      # comparison ``stock >= quantity`` (online_market.py enough_stock) is
      # authored, in the open, in LTL.
      # =====================================================================
      - desc: "a completed add_to_cart requires the product to have stock for the requested quantity"
        G: {ltl: "G((called(add_to_cart) & arg_value(add_to_cart, succeeded) >= 1 & arg_value(add_to_cart, gate_enough_stock_active) >= 1) -> arg_value(add_to_cart, product_stock) >= arg_value(add_to_cart, quantity))"}
      - desc: "a completed exchange_product requires the new product to have stock for the requested quantity"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_enough_stock_present) >= 1) -> arg_value(exchange_product, product_stock) >= arg_value(exchange_product, quantity))"}

      # UNGROUNDABLE (honestly out of scope -- non-numeric / per-task history):
      #   * coupon_not_expired / coupon_valid / coupon_not_already_used: coupon is a
      #     separate collection; expiry is groundable but the coupon gates sit in
      #     OR/guarded positions paired with non-numeric coupon-state checks
      #     (used-history is a per-user set we do not enumerate here).
      #   * credit_status_* (standalone) / order_* / *_in_cart / unique_review:
      #     string / enum / set-membership / existence, not numeric.

      # === Added coverage: online_market credit/order/product/coupon gates ===
      - desc: "add_review: credit_status_not_restricted_or_suspended"
        G: {ltl: "G((called(add_review) & arg_value(add_review, succeeded) >= 1 & arg_value(add_review, gate_credit_status_not_restricted_or_suspended_active) >= 1) -> arg_value(add_review, state_credit_ok) >= 1)"}
      - desc: "use_coupon: credit_status_not_restricted_or_suspended"
        G: {ltl: "G((called(use_coupon) & arg_value(use_coupon, succeeded) >= 1 & arg_value(use_coupon, gate_credit_status_not_restricted_or_suspended_active) >= 1) -> arg_value(use_coupon, state_credit_ok) >= 1)"}
      - desc: "place_order: credit_status_not_suspended"
        G: {ltl: "G((called(place_order) & arg_value(place_order, succeeded) >= 1 & arg_value(place_order, gate_credit_status_not_suspended_active) >= 1) -> arg_value(place_order, state_credit_not_suspended) >= 1)"}
      - desc: "exchange_product: credit_status_excellent"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_credit_status_excellent_active) >= 1) -> arg_value(exchange_product, state_credit_excellent) >= 1)"}
      - desc: "return_order: credit_status_excellent"
        G: {ltl: "G((called(return_order) & arg_value(return_order, succeeded) >= 1 & arg_value(return_order, gate_credit_status_excellent_active) >= 1) -> arg_value(return_order, state_credit_excellent) >= 1)"}
      - desc: "add_review: internal_check_product_exist"
        G: {ltl: "G((called(add_review) & arg_value(add_review, succeeded) >= 1 & arg_value(add_review, gate_internal_check_product_exist_active) >= 1) -> arg_value(add_review, state_product_exists) >= 1)"}
      - desc: "exchange_product: internal_check_product_exist (the new product)"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_internal_check_product_exist_active) >= 1) -> arg_value(exchange_product, state_new_product_exists) >= 1)"}
      - desc: "add_to_cart: internal_check_product_exist"
        G: {ltl: "G((called(add_to_cart) & arg_value(add_to_cart, succeeded) >= 1 & arg_value(add_to_cart, gate_internal_check_product_exist_active) >= 1) -> arg_value(add_to_cart, state_product_exists) >= 1)"}
      - desc: "add_review: within_review_limits"
        G: {ltl: "G((called(add_review) & arg_value(add_review, succeeded) >= 1 & arg_value(add_review, gate_within_review_limits_active) >= 1) -> arg_value(add_review, state_rating_in_bounds) >= 1)"}
      - desc: "add_review: unique_review"
        G: {ltl: "G((called(add_review) & arg_value(add_review, succeeded) >= 1 & arg_value(add_review, gate_unique_review_active) >= 1) -> arg_value(add_review, state_unique_review) >= 1)"}
      - desc: "add_review: product_bought_by_user"
        G: {ltl: "G((called(add_review) & arg_value(add_review, succeeded) >= 1 & arg_value(add_review, gate_product_bought_by_user_active) >= 1) -> arg_value(add_review, state_product_bought) >= 1)"}
      - desc: "add_to_cart: enough_stock"
        G: {ltl: "G((called(add_to_cart) & arg_value(add_to_cart, succeeded) >= 1 & arg_value(add_to_cart, gate_enough_stock_active) >= 1) -> arg_value(add_to_cart, state_stock) >= arg_value(add_to_cart, quantity))"}
      - desc: "exchange_product: enough_stock (the new product)"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_enough_stock_active) >= 1) -> arg_value(exchange_product, state_new_stock) >= arg_value(exchange_product, quantity))"}
      - desc: "place_order: has_items_in_cart"
        G: {ltl: "G((called(place_order) & arg_value(place_order, succeeded) >= 1 & arg_value(place_order, gate_has_items_in_cart_active) >= 1) -> arg_value(place_order, state_has_cart_items) >= 1)"}
      - desc: "place_order: has_shipping_address"
        G: {ltl: "G((called(place_order) & arg_value(place_order, succeeded) >= 1 & arg_value(place_order, gate_has_shipping_address_active) >= 1) -> arg_value(place_order, state_has_shipping) >= 1)"}
      - desc: "exchange_product: internal_check_order_exist"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_internal_check_order_exist_active) >= 1) -> arg_value(exchange_product, state_order_exists) >= 1)"}
      - desc: "return_order: internal_check_order_exist"
        G: {ltl: "G((called(return_order) & arg_value(return_order, succeeded) >= 1 & arg_value(return_order, gate_internal_check_order_exist_active) >= 1) -> arg_value(return_order, state_order_exists) >= 1)"}
      - desc: "use_coupon: internal_check_order_exist"
        G: {ltl: "G((called(use_coupon) & arg_value(use_coupon, succeeded) >= 1 & arg_value(use_coupon, gate_internal_check_order_exist_active) >= 1) -> arg_value(use_coupon, state_order_exists) >= 1)"}
      - desc: "cancel_order: internal_check_order_exist"
        G: {ltl: "G((called(cancel_order) & arg_value(cancel_order, succeeded) >= 1 & arg_value(cancel_order, gate_internal_check_order_exist_active) >= 1) -> arg_value(cancel_order, state_order_exists) >= 1)"}
      - desc: "exchange_product: order_delivered"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_order_delivered_active) >= 1) -> arg_value(exchange_product, state_order_delivered) >= 1)"}
      - desc: "return_order: order_delivered"
        G: {ltl: "G((called(return_order) & arg_value(return_order, succeeded) >= 1 & arg_value(return_order, gate_order_delivered_active) >= 1) -> arg_value(return_order, state_order_delivered) >= 1)"}
      - desc: "cancel_order: order_processing"
        G: {ltl: "G((called(cancel_order) & arg_value(cancel_order, succeeded) >= 1 & arg_value(cancel_order, gate_order_processing_active) >= 1) -> arg_value(cancel_order, state_order_processing) >= 1)"}
      - desc: "exchange_product: product_exists_in_order"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_product_exists_in_order_active) >= 1) -> arg_value(exchange_product, state_product_in_order) >= 1)"}
      - desc: "exchange_product: within_exchange_period"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_within_exchange_period_active) >= 1) -> arg_value(exchange_product, now_epoch) <= arg_value(exchange_product, exchange_window_end_epoch))"}
      - desc: "return_order: within_return_period"
        G: {ltl: "G((called(return_order) & arg_value(return_order, succeeded) >= 1 & arg_value(return_order, gate_within_return_period_active) >= 1) -> arg_value(return_order, now_epoch) <= arg_value(return_order, return_window_end_epoch))"}
      - desc: "exchange_product: less_than_max_exchanges"
        G: {ltl: "G((called(exchange_product) & arg_value(exchange_product, succeeded) >= 1 & arg_value(exchange_product, gate_less_than_max_exchanges_active) >= 1) -> arg_value(exchange_product, state_order_exchanges) < arg_value(exchange_product, param_max_exchange_times))"}
      - desc: "use_coupon: coupon_not_expired"
        G: {ltl: "G((called(use_coupon) & arg_value(use_coupon, succeeded) >= 1 & arg_value(use_coupon, gate_coupon_not_expired_active) >= 1) -> arg_value(use_coupon, now_epoch) < arg_value(use_coupon, coupon_exp_epoch))"}
      - desc: "use_coupon: coupon_not_already_used"
        G: {ltl: "G((called(use_coupon) & arg_value(use_coupon, succeeded) >= 1 & arg_value(use_coupon, gate_coupon_not_already_used_active) >= 1) -> arg_value(use_coupon, state_coupon_not_used) >= 1)"}
      - desc: "use_coupon: coupon_valid"
        G: {ltl: "G((called(use_coupon) & arg_value(use_coupon, succeeded) >= 1 & arg_value(use_coupon, gate_coupon_valid_active) >= 1) -> arg_value(use_coupon, state_coupon_valid) >= 1)"}
      - desc: "use_coupon: internal_check_coupon_exist"
        G: {ltl: "G((called(use_coupon) & arg_value(use_coupon, succeeded) >= 1 & arg_value(use_coupon, gate_internal_check_coupon_exist_active) >= 1) -> arg_value(use_coupon, state_coupon_exists) >= 1)"}
