<text x="78" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#18356d" font-weight="600">Read scores as active-gate trace classification. The contract applies only when the SOP gate requires admin auth.</text>
<text x="78" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#18356d" font-weight="400">“Gate guard” means the formula itself checks that context; all v2 training examples had the gate active.</text>
