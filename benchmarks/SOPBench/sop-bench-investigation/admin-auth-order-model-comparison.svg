<text x="55" y="1201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#526170" font-weight="400">• No holdout traces were sent to the models. Results are exploratory; v1 holdout had been seen during prompt development. v2 prompt omitted a gate predicate.</text>
