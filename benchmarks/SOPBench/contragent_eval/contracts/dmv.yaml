# =============================================================================
# ContrAgent SOP contracts -- dmv domain.
#
# PER-TASK GATE SCOPING (false-positive fix): SOPBench gates are per-task
# customizable -- a gate is part of the SOP for some tasks and disabled for
# others. convert.py reads each task's own ``constraints`` tree (the policy
# spec, NOT the satisfaction verdict -- SOPBench's evaluator/State_Tracker is
# never run) and grounds a per-task boolean ``gate_<G>_active`` for every gate
# the tree UNCONDITIONALLY requires (and/chain-required; OR branches and guarded
# ``gate`` nodes are conservatively inactive). It is injected onto the goal
# tool-call, and each contract is guarded with
#     & arg_value(<goal>, gate_<G>_active) >= 1
# so a gate only fires on tasks whose SOP actually includes it (the added
# assumption is exactly "& gate_<G>_active"; the gate check is unchanged).
#
# The user-existence precondition is discharged by an explicit existence check
# OR a successful login (login_user verifies the username internally).
#
# Out of scope (honest): DB-state gates (eligibility / balances / dates /
# capacities) are not observable in tool args; non-user existence checks are
# enforced inside the goal tool in SOPBench "program" mode (a separate check
# call is rarely made even on legitimate completions, so a precedence rule there
# only over-blocks) and are dropped rather than kept as noise.
#
#
# HONESTY PRINCIPLE: every rule is a human-readable LTL contract authored from
# the dmv SOP in env/domains/dmv/dmv.py (State_Tracker conditions
# and each goal's dependency tree in data/dmv_tasks.json). No rule reads a
# precomputed SOP verdict. Each gate is required by the SOP for that goal in
# >=90% of the benchmark's tasks (gates that are per-task customizable below
# that bar are omitted to avoid systematically overblocking legitimately
# disabled cases). All atoms are OBSERVABLE in the trajectory:
#
#   * called(<tool>)                       -- the tool was actually called
#   * arg_value(<tool>, succeeded)         -- this call returned success
#                                             (syntactic read of the result)
#   * arg_value(<tool>, prior_logged_in)   -- login_user succeeded earlier
#                                             (observable auth fact, not a verdict)
#   * arg_value(<tool>, <amount>)          -- the real monetary argument
#
# Ordering rules are success-scoped: they fire only when the goal actually
# COMPLETED without its required check -- a refused/failed attempt took no
# effect and is not an SOP violation.
#
#   "check C must precede a completed goal G":
#     (!(called(G) & G.succeeded) U called(C)) | G(!(called(G) & G.succeeded))
#
# NOT COVERED (ungroundable -- DB-state gates with no observable arg):
#   internal_has_vehicle / internal_has_dl, valid_vehicle_insurance, internal_valid_test_type, within_vehicle_renewal_period, above_minimum_age, drive_test_ready, within_attempt_limit, test_scheduled, before_test_date, internal_vehicle_registered, within_dl_renewal_period, is_*_address_different -- read vehicle/DL records, test state, ages and date windows from the DB.
# =============================================================================

version: "1"

agents:
  "*":
    contracts:

      # --- Auth: logged_in_user (login before completing the action).

      # --- Existence-check ordering required by the SOP before each goal.
      - desc: "internal_check_username_exist must precede a completed cancel_test (SOP existence check)"
        G: {ltl: "(!(called(cancel_test) & arg_value(cancel_test, succeeded) >= 1 & arg_value(cancel_test, gate_internal_check_username_exist_active) >= 1) U (called(internal_check_username_exist) | called(login_user))) | G(!(called(cancel_test) & arg_value(cancel_test, succeeded) >= 1 & arg_value(cancel_test, gate_internal_check_username_exist_active) >= 1))"}
      - desc: "internal_check_username_exist must precede a completed transfer_title (SOP existence check)"
        G: {ltl: "(!(called(transfer_title) & arg_value(transfer_title, succeeded) >= 1 & arg_value(transfer_title, gate_internal_check_username_exist_active) >= 1) U (called(internal_check_username_exist) | called(login_user))) | G(!(called(transfer_title) & arg_value(transfer_title, succeeded) >= 1 & arg_value(transfer_title, gate_internal_check_username_exist_active) >= 1))"}
      - desc: "internal_check_username_exist must precede a completed update_test_status (SOP existence check)"
        G: {ltl: "(!(called(update_test_status) & arg_value(update_test_status, succeeded) >= 1 & arg_value(update_test_status, gate_internal_check_username_exist_active) >= 1) U (called(internal_check_username_exist) | called(login_user))) | G(!(called(update_test_status) & arg_value(update_test_status, succeeded) >= 1 & arg_value(update_test_status, gate_internal_check_username_exist_active) >= 1))"}

      # =====================================================================
      # STATE / ELIGIBILITY GATES -- grounded via DERIVED observable numerics.
      # convert.py computes facts off the GIVEN world state + interaction_time:
      #   now_epoch                -- ordinal day of interaction_time
      #   veh_reg_epoch            -- ordinal of the named vehicle's reg_date
      #   veh_renewal_start_epoch  -- reg_date - vehicle_renewal_window
      #   dl_exp_epoch             -- ordinal of the DL exp_date
      #   dl_renewal_start_epoch   -- exp_date - dl_renewal_window
      #   age_years                -- whole-year age from birthday vs now
      #   test_attempts            -- attempts on the named test_type
      # Per-vehicle / per-test values are selected by the entity id the goal CALL
      # itself names (plate_num / test_type). Each comparison is the literal
      # dmv.py predicate, authored in the open. No verdict is grounded.

      # within_vehicle_renewal_period: start <= now <= expiry (expiry = reg_date)
      - desc: "renew_vehicle requires the interaction time at or before the vehicle expiry"
        G: {ltl: "G((called(renew_vehicle) & arg_value(renew_vehicle, succeeded) >= 1 & arg_value(renew_vehicle, gate_within_vehicle_renewal_period_active) >= 1) -> arg_value(renew_vehicle, now_epoch) <= arg_value(renew_vehicle, veh_reg_epoch))"}
      - desc: "renew_vehicle requires the interaction time at or after the vehicle renewal window start"
        G: {ltl: "G((called(renew_vehicle) & arg_value(renew_vehicle, succeeded) >= 1 & arg_value(renew_vehicle, gate_within_vehicle_renewal_period_active) >= 1) -> arg_value(renew_vehicle, now_epoch) >= arg_value(renew_vehicle, veh_renewal_start_epoch))"}

      # within_dl_renewal_period: start <= now <= expiry
      - desc: "renew_dl requires the interaction time at or before the license expiry"
        G: {ltl: "G((called(renew_dl) & arg_value(renew_dl, succeeded) >= 1 & arg_value(renew_dl, gate_within_dl_renewal_period_active) >= 1) -> arg_value(renew_dl, now_epoch) <= arg_value(renew_dl, dl_exp_epoch))"}
      - desc: "renew_dl requires the interaction time at or after the license renewal window start"
        G: {ltl: "G((called(renew_dl) & arg_value(renew_dl, succeeded) >= 1 & arg_value(renew_dl, gate_within_dl_renewal_period_active) >= 1) -> arg_value(renew_dl, now_epoch) >= arg_value(renew_dl, dl_renewal_start_epoch))"}

      # above_minimum_age: age >= min_age   (schedule_test)
      - desc: "schedule_test requires the user to meet the minimum age"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_above_minimum_age_active) >= 1) -> arg_value(schedule_test, age_years) >= arg_value(schedule_test, param_min_age))"}

      # within_attempt_limit: tests[test_type].attempts < attempt_limit
      - desc: "schedule_test requires the named test to be under the attempt limit"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_within_attempt_limit_active) >= 1) -> arg_value(schedule_test, test_attempts) < arg_value(schedule_test, param_attempt_limit))"}

      # UNGROUNDABLE (honestly out of scope -- non-numeric / cross-entity):
      #   * valid_vehicle_insurance / is_*_address_different / test_type_is_drive /
      #     drive_test_ready / test_scheduled: string equality / enum / existence.
      #   * before_test_date: a scheduled_time arg vs now (OR-branch / guarded gate
      #     here, not unconditionally required -> conservatively omitted).
      # =====================================================================

      # === Added coverage: DMV domain-specific gates (state/date/count facts) ===
      - desc: "change_vehicle_address: internal_has_vehicle"
        G: {ltl: "G((called(change_vehicle_address) & arg_value(change_vehicle_address, succeeded) >= 1 & arg_value(change_vehicle_address, gate_internal_has_vehicle_active) >= 1) -> arg_value(change_vehicle_address, state_vehicle_exists) >= 1)"}
      - desc: "renew_vehicle: internal_has_vehicle"
        G: {ltl: "G((called(renew_vehicle) & arg_value(renew_vehicle, succeeded) >= 1 & arg_value(renew_vehicle, gate_internal_has_vehicle_active) >= 1) -> arg_value(renew_vehicle, state_vehicle_exists) >= 1)"}
      - desc: "transfer_title: internal_has_vehicle"
        G: {ltl: "G((called(transfer_title) & arg_value(transfer_title, succeeded) >= 1 & arg_value(transfer_title, gate_internal_has_vehicle_active) >= 1) -> arg_value(transfer_title, state_vehicle_exists) >= 1)"}
      - desc: "validate_vehicle_insurance: internal_has_vehicle"
        G: {ltl: "G((called(validate_vehicle_insurance) & arg_value(validate_vehicle_insurance, succeeded) >= 1 & arg_value(validate_vehicle_insurance, gate_internal_has_vehicle_active) >= 1) -> arg_value(validate_vehicle_insurance, state_vehicle_exists) >= 1)"}
      - desc: "change_dl_address: internal_has_dl"
        G: {ltl: "G((called(change_dl_address) & arg_value(change_dl_address, succeeded) >= 1 & arg_value(change_dl_address, gate_internal_has_dl_active) >= 1) -> arg_value(change_dl_address, state_has_dl) >= 1)"}
      - desc: "renew_dl: internal_has_dl"
        G: {ltl: "G((called(renew_dl) & arg_value(renew_dl, succeeded) >= 1 & arg_value(renew_dl, gate_internal_has_dl_active) >= 1) -> arg_value(renew_dl, state_has_dl) >= 1)"}
      - desc: "transfer_title: internal_has_dl"
        G: {ltl: "G((called(transfer_title) & arg_value(transfer_title, succeeded) >= 1 & arg_value(transfer_title, gate_internal_has_dl_active) >= 1) -> arg_value(transfer_title, state_has_dl) >= 1)"}
      - desc: "update_dl_legal_name: internal_has_dl"
        G: {ltl: "G((called(update_dl_legal_name) & arg_value(update_dl_legal_name, succeeded) >= 1 & arg_value(update_dl_legal_name, gate_internal_has_dl_active) >= 1) -> arg_value(update_dl_legal_name, state_has_dl) >= 1)"}
      - desc: "validate_vehicle_insurance: internal_has_dl"
        G: {ltl: "G((called(validate_vehicle_insurance) & arg_value(validate_vehicle_insurance, succeeded) >= 1 & arg_value(validate_vehicle_insurance, gate_internal_has_dl_active) >= 1) -> arg_value(validate_vehicle_insurance, state_has_dl) >= 1)"}
      - desc: "register_vehicle: internal_has_dl"
        G: {ltl: "G((called(register_vehicle) & arg_value(register_vehicle, succeeded) >= 1 & arg_value(register_vehicle, gate_internal_has_dl_active) >= 1) -> arg_value(register_vehicle, state_has_dl) >= 1)"}
      - desc: "renew_vehicle: valid_vehicle_insurance"
        G: {ltl: "G((called(renew_vehicle) & arg_value(renew_vehicle, succeeded) >= 1 & arg_value(renew_vehicle, gate_valid_vehicle_insurance_active) >= 1) -> arg_value(renew_vehicle, state_vehicle_insurance_valid) >= 1)"}
      - desc: "validate_vehicle_insurance: valid_vehicle_insurance"
        G: {ltl: "G((called(validate_vehicle_insurance) & arg_value(validate_vehicle_insurance, succeeded) >= 1 & arg_value(validate_vehicle_insurance, gate_valid_vehicle_insurance_active) >= 1) -> arg_value(validate_vehicle_insurance, state_vehicle_insurance_valid) >= 1)"}
      - desc: "renew_vehicle: within_vehicle_renewal_period"
        G: {ltl: "G((called(renew_vehicle) & arg_value(renew_vehicle, succeeded) >= 1 & arg_value(renew_vehicle, gate_within_vehicle_renewal_period_active) >= 1) -> (arg_value(renew_vehicle, now_epoch) >= arg_value(renew_vehicle, veh_renew_start_epoch) & arg_value(renew_vehicle, now_epoch) <= arg_value(renew_vehicle, veh_reg_epoch)))"}
      - desc: "renew_dl: within_dl_renewal_period"
        G: {ltl: "G((called(renew_dl) & arg_value(renew_dl, succeeded) >= 1 & arg_value(renew_dl, gate_within_dl_renewal_period_active) >= 1) -> (arg_value(renew_dl, now_epoch) >= arg_value(renew_dl, dl_renew_start_epoch) & arg_value(renew_dl, now_epoch) <= arg_value(renew_dl, dl_exp_epoch)))"}
      - desc: "schedule_test: above_minimum_age"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_above_minimum_age_active) >= 1) -> arg_value(schedule_test, state_age) >= arg_value(schedule_test, param_min_age))"}
      - desc: "schedule_test: within_attempt_limit"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_within_attempt_limit_active) >= 1) -> arg_value(schedule_test, state_test_attempts) < arg_value(schedule_test, param_attempt_limit))"}
      - desc: "cancel_test: test_scheduled"
        G: {ltl: "G((called(cancel_test) & arg_value(cancel_test, succeeded) >= 1 & arg_value(cancel_test, gate_test_scheduled_active) >= 1) -> arg_value(cancel_test, state_test_scheduled) >= 1)"}
      - desc: "update_test_status: test_scheduled"
        G: {ltl: "G((called(update_test_status) & arg_value(update_test_status, succeeded) >= 1 & arg_value(update_test_status, gate_test_scheduled_active) >= 1) -> arg_value(update_test_status, state_test_scheduled) >= 1)"}
      - desc: "cancel_test: before_test_date"
        G: {ltl: "G((called(cancel_test) & arg_value(cancel_test, succeeded) >= 1 & arg_value(cancel_test, gate_before_test_date_active) >= 1) -> arg_value(cancel_test, now_epoch) <= arg_value(cancel_test, test_sched_epoch))"}
      - desc: "update_test_status: before_test_date"
        G: {ltl: "G((called(update_test_status) & arg_value(update_test_status, succeeded) >= 1 & arg_value(update_test_status, gate_before_test_date_active) >= 1) -> arg_value(update_test_status, now_epoch) <= arg_value(update_test_status, test_sched_epoch))"}
      - desc: "schedule_test: internal_check_test_slot_available"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_internal_check_test_slot_available_active) >= 1) -> arg_value(schedule_test, state_slot_available) >= 1)"}
      - desc: "cancel_test: internal_valid_test_type"
        G: {ltl: "G((called(cancel_test) & arg_value(cancel_test, succeeded) >= 1 & arg_value(cancel_test, gate_internal_valid_test_type_active) >= 1) -> arg_value(cancel_test, state_test_type_valid) >= 1)"}
      - desc: "schedule_test: internal_valid_test_type"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_internal_valid_test_type_active) >= 1) -> arg_value(schedule_test, state_test_type_valid) >= 1)"}
      - desc: "update_test_status: internal_valid_test_type"
        G: {ltl: "G((called(update_test_status) & arg_value(update_test_status, succeeded) >= 1 & arg_value(update_test_status, gate_internal_valid_test_type_active) >= 1) -> arg_value(update_test_status, state_test_type_valid) >= 1)"}
      - desc: "register_vehicle: internal_vehicle_registered"
        G: {ltl: "G((called(register_vehicle) & arg_value(register_vehicle, succeeded) >= 1 & arg_value(register_vehicle, gate_internal_vehicle_registered_active) >= 1) -> arg_value(register_vehicle, state_plate_registered) <= 0)"}
      - desc: "change_dl_address: is_dl_address_different"
        G: {ltl: "G((called(change_dl_address) & arg_value(change_dl_address, succeeded) >= 1 & arg_value(change_dl_address, gate_is_dl_address_different_active) >= 1) -> arg_value(change_dl_address, state_dl_address_same) <= 0)"}
      - desc: "change_vehicle_address: is_vehicle_address_different"
        G: {ltl: "G((called(change_vehicle_address) & arg_value(change_vehicle_address, succeeded) >= 1 & arg_value(change_vehicle_address, gate_is_vehicle_address_different_active) >= 1) -> arg_value(change_vehicle_address, state_vehicle_address_same) <= 0)"}
      - desc: "schedule_test: drive_test_ready"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_drive_test_ready_active) >= 1) -> arg_value(schedule_test, state_drive_ready) >= 1)"}

      # === RESTORED auth contracts (for capable models that log in) ===
      - desc: "cancel_test: logged_in_user"
        G: {ltl: "G((called(cancel_test) & arg_value(cancel_test, succeeded) >= 1 & arg_value(cancel_test, gate_logged_in_user_active) >= 1) -> arg_value(cancel_test, prior_logged_in) >= 1)"}
      - desc: "change_dl_address: logged_in_user"
        G: {ltl: "G((called(change_dl_address) & arg_value(change_dl_address, succeeded) >= 1 & arg_value(change_dl_address, gate_logged_in_user_active) >= 1) -> arg_value(change_dl_address, prior_logged_in) >= 1)"}
      - desc: "change_vehicle_address: logged_in_user"
        G: {ltl: "G((called(change_vehicle_address) & arg_value(change_vehicle_address, succeeded) >= 1 & arg_value(change_vehicle_address, gate_logged_in_user_active) >= 1) -> arg_value(change_vehicle_address, prior_logged_in) >= 1)"}
      - desc: "register_vehicle: logged_in_user"
        G: {ltl: "G((called(register_vehicle) & arg_value(register_vehicle, succeeded) >= 1 & arg_value(register_vehicle, gate_logged_in_user_active) >= 1) -> arg_value(register_vehicle, prior_logged_in) >= 1)"}
      - desc: "renew_dl: logged_in_user"
        G: {ltl: "G((called(renew_dl) & arg_value(renew_dl, succeeded) >= 1 & arg_value(renew_dl, gate_logged_in_user_active) >= 1) -> arg_value(renew_dl, prior_logged_in) >= 1)"}
      - desc: "renew_vehicle: logged_in_user"
        G: {ltl: "G((called(renew_vehicle) & arg_value(renew_vehicle, succeeded) >= 1 & arg_value(renew_vehicle, gate_logged_in_user_active) >= 1) -> arg_value(renew_vehicle, prior_logged_in) >= 1)"}
      - desc: "schedule_test: logged_in_user"
        G: {ltl: "G((called(schedule_test) & arg_value(schedule_test, succeeded) >= 1 & arg_value(schedule_test, gate_logged_in_user_active) >= 1) -> arg_value(schedule_test, prior_logged_in) >= 1)"}
      - desc: "transfer_title: logged_in_user"
        G: {ltl: "G((called(transfer_title) & arg_value(transfer_title, succeeded) >= 1 & arg_value(transfer_title, gate_logged_in_user_active) >= 1) -> arg_value(transfer_title, prior_logged_in) >= 1)"}
      - desc: "update_dl_legal_name: logged_in_user"
        G: {ltl: "G((called(update_dl_legal_name) & arg_value(update_dl_legal_name, succeeded) >= 1 & arg_value(update_dl_legal_name, gate_logged_in_user_active) >= 1) -> arg_value(update_dl_legal_name, prior_logged_in) >= 1)"}
      - desc: "update_test_status: logged_in_user"
        G: {ltl: "G((called(update_test_status) & arg_value(update_test_status, succeeded) >= 1 & arg_value(update_test_status, gate_logged_in_user_active) >= 1) -> arg_value(update_test_status, prior_logged_in) >= 1)"}
      - desc: "validate_vehicle_insurance: logged_in_user"
        G: {ltl: "G((called(validate_vehicle_insurance) & arg_value(validate_vehicle_insurance, succeeded) >= 1 & arg_value(validate_vehicle_insurance, gate_logged_in_user_active) >= 1) -> arg_value(validate_vehicle_insurance, prior_logged_in) >= 1)"}
